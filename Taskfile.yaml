version: '3'

tasks:
  build:
    desc: Build every module that has its own build task
    cmds:
      - task: operator:build
      - task: clickhouse-migrate:build
      - task: queryapi:build
      - task: nkey-generator:build

  test:
    desc: Test every module that has its own test task
    cmds:
      - task: operator:test
      - task: clickhouse-migrate:test
      - task: natsreceiver:test
      - task: natsexporter:test
      - task: unbatchprocessor:test
      - task: queryapi:test
      - task: nkey-generator:test

  lint:
    desc: Lint every module that has its own lint task
    cmds:
      - task: operator:lint
      - task: clickhouse-migrate:lint
      - task: natsreceiver:lint
      - task: natsexporter:lint
      - task: unbatchprocessor:lint
      - task: queryapi:lint
      - task: nkey-generator:lint

  tidy:
    desc: Run go mod tidy in every module (mirrors CI)
    cmds:
      - task: operator:tidy
      - task: clickhouse-migrate:tidy
      - task: natsreceiver:tidy
      - task: natsexporter:tidy
      - task: unbatchprocessor:tidy
      - task: nkey-generator:tidy

  ci:
    desc: Run everything CI runs, locally, before pushing
    cmds:
      - task: tidy
      - task: lint
      - task: test
      - task: operator:test-e2e

includes:
  operator:
    taskfile: ./operator
    dir: ./operator
  clickhouse-migrate:
    taskfile: ./clickhouse-migrate
    dir: ./clickhouse-migrate
  natsreceiver:
    taskfile: ./receiver/natsreceiver
    dir: ./receiver/natsreceiver
  natsexporter:
    taskfile: ./exporter/natsexporter
    dir: ./exporter/natsexporter
  unbatchprocessor:
    taskfile: ./processor/unbatchprocessor
    dir: ./processor/unbatchprocessor
  queryapi:
    taskfile: ./queryapi
    dir: ./queryapi
  nkey-generator:
    taskfile: ./nkey-generator
    dir: ./nkey-generator
