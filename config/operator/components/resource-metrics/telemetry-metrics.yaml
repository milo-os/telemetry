apiVersion: resourcemetrics.miloapis.com/v1alpha1
kind: ResourceMetricsPolicy
metadata:
  name: telemetry-metrics
spec:
  generators:
    - name: export-policy-info
      resource:
        group: telemetry.miloapis.com
        version: v1alpha1
        resource: exportpolicies
      families:
        - name: datum_cloud_telemetry_export_policy_info
          help: "Exposes metadata about each ExportPolicy resource."
          type: gauge
          metrics:
            - labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: uid
                  value: "object.metadata.uid"

    - name: export-policy-created
      resource:
        group: telemetry.miloapis.com
        version: v1alpha1
        resource: exportpolicies
      families:
        - name: datum_cloud_telemetry_export_policy_created
          help: "Unix creation timestamp of each ExportPolicy resource."
          type: gauge
          metrics:
            - value: "double(timestamp(object.metadata.creationTimestamp).getSeconds())"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"

    - name: export-policy-status-condition
      resource:
        group: telemetry.miloapis.com
        version: v1alpha1
        resource: exportpolicies
      families:
        - name: datum_cloud_telemetry_export_policy_status_condition
          help: "Status condition for each ExportPolicy resource, one series per condition type."
          type: gauge
          metrics:
            - forEach: "object.status.conditions"
              value: "item.status == 'True' ? 1.0 : 0.0"
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: condition
                  value: "item.type"
                - name: reason
                  value: "item.reason"
                - name: status
                  value: "item.status"

    - name: export-policy-sink-status-condition
      resource:
        group: telemetry.miloapis.com
        version: v1alpha1
        resource: exportpolicies
      families:
        - name: datum_cloud_telemetry_export_policy_sink_status_condition
          help: "Ready condition status for each sink in an ExportPolicy, one series per sink."
          type: gauge
          metrics:
            - forEach: "object.status.sinks"
              value: |
                item.conditions.exists(c, c.type == 'Ready' && c.status == 'True') ? 1.0 : 0.0
              labels:
                - name: name
                  value: "object.metadata.name"
                - name: namespace
                  value: "object.metadata.namespace"
                - name: sink_name
                  value: "item.name"
                - name: condition
                  value: "'Ready'"
