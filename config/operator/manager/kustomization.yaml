resources:
- manager.yaml
kind: Kustomization
images:
- name: ghcr.io/milo-os/telemetry
  newName: ghcr.io/milo-os/telemetry
  newTag: latest

  # Create a config map with the configuration to use for the operator.
      # TODO: Determine why the deployment isn't getting updated to add in the hash
configMapGenerator:
- files:
  - service-config.yaml
  name: service-config
  options:
    disableNameSuffixHash: true
apiVersion: kustomize.config.k8s.io/v1beta1
