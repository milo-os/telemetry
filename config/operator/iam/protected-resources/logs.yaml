# The log query surface queryapi serves. These are not CRDs: nothing stores a
# Log object, and the permissions below gate the Loki-shaped routes in
# queryapi/routes.go. See queryapi/README.md.
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: o11y.miloapis.com-logs
spec:
  serviceRef:
    name: "o11y.miloapis.com"
  kind: Log
  plural: logs
  singular: log
  permissions:
    # Two gates, both SubjectAccessReviews against this IAM, and a caller needs
    # a grant at each.
    #
    # Keep the collection-level permission for compatibility while subresource
    # checks are disabled. The aggregator parses Loki routes under
    # /logs/loki/api/... as the `api` subresource when checks are enabled.
    - get
    # The actions below are queryapi's own, asked after the proxy hop, where
    # the route is known. query returns log lines; the get* actions return only
    # metadata about them. Label values in particular carry pod names,
    # hostnames and customer identifiers, which is a boundary that cannot be
    # drawn later without migrating every policy that granted a coarser
    # permission.
    - query
    - getLabels
    - getSeries
  subresources:
    - name: api
      permissions:
        - get
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
