# The metric query surface. queryapi's Prometheus-shaped routes return 501
# today; declaring the permissions now means the endpoints cannot ship
# ungated. See queryapi/README.md.
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: o11y.miloapis.com-metrics
spec:
  serviceRef:
    name: "o11y.miloapis.com"
  kind: Metric
  plural: metrics
  singular: metric
  permissions:
    # Milo's aggregator authorizes the proxy hop with the stock path parse, so
    # every metrics route renders as `get` on `metrics`. It means "may reach
    # the metrics API"; the actions below are queryapi's own, per route. See
    # the logs ProtectedResource for the full explanation.
    - get
    - query
    - getLabels
    - getSeries
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
