# The metric query surface. queryapi's Prometheus-shaped routes return 501
# today; declaring the permissions now means the endpoints cannot ship
# ungated. See queryapi/README.md.
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: o11y.miloapis.com-metrics
spec:
  serviceRef:
    name: "o11y.miloapis.com"
  kind: Metric
  plural: metrics
  singular: metric
  permissions:
    # Keep the collection-level permission for compatibility while subresource
    # checks are disabled. The aggregator parses Prometheus routes under
    # /metrics/api/... as the `api` subresource when checks are enabled.
    - get
    - query
    - getLabels
    - getSeries
  subresources:
    - name: api
      permissions:
        - get
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Project
