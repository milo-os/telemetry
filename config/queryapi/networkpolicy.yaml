# Defence in depth, not the trust boundary.
#
# queryapi now terminates TLS and verifies the client certificate on the
# connection against the front proxy's CA before it believes the X-Remote-*
# identity a request carries (see deployment.yaml's serving-cert volume). A
# client that reached this port without that certificate cannot authenticate,
# so the headers are no longer trusted on the strength of who can dial us.
#
# This policy still earns its keep: it keeps unauthenticated traffic off the
# listener entirely rather than letting it fail at the TLS handshake, and it is
# the second gate if the requestheader configuration is ever wrong. Narrow it
# further if you can; do not widen it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queryapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: queryapi
  policyTypes:
    - Ingress
  ingress:
    # PLACEHOLDER -- the consumer must patch this to select the namespace
    # running milo-apiserver.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: PLACEHOLDER-milo-namespace
      ports:
        - protocol: TCP
          port: 8443
