# Generic node-local agent -- see README.md.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: node-agent-collector
spec:
  mode: daemonset
  managementState: managed
  # Custom otelcol distribution (unbatch+nats) -- publishes to NATS itself.
  # Tag overlaid at publish by the kustomize-bundle workflow (publish.yaml).
  image: ghcr.io/milo-os/o11y/otelcol:v0.0.0-dev
  imagePullPolicy: Always
  observability:
    metrics:
      enableMetrics: true
  hostNetwork: false
  # 65532 reads the CSI cert, group 0 the 0640 root:root pod logs.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 65532
    supplementalGroups: [0]
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  nodeSelector:
    kubernetes.io/os: linux
  # Not "Exists" -- that overrides virtual-kubelet.io/provider.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: compute.datumapis.com/runtime
      operator: Exists
      effect: NoSchedule
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    # mTLS client cert for the edge-local NATS client port (o11y-system
    # ClusterIssuer via CSI; PLACEHOLDER-issuer patched by the edge app-sync).
    - name: nats-client-certs
      csi:
        driver: csi.cert-manager.io
        readOnly: true
        volumeAttributes:
          csi.cert-manager.io/issuer-name: PLACEHOLDER-issuer
          csi.cert-manager.io/issuer-kind: ClusterIssuer
          csi.cert-manager.io/common-name: node-agent-collector-nats-client
          csi.cert-manager.io/duration: "2160h"
          csi.cert-manager.io/renew-before: "360h"
          csi.cert-manager.io/key-usages: "client auth"
          csi.cert-manager.io/fs-group: "65532"
  volumeMounts:
    - name: nats-client-certs
      mountPath: /etc/otel/nats-client
      readOnly: true
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    - name: CLUSTER_NAME
      value: "${cluster}"
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  config:
    extensions:
      k8s_observer:
        auth_type: serviceAccount
        observe_pods: true
        observe_nodes: false
        # This DaemonSet pod's own node -- its hostPath only has that node's logs.
        node: ${env:K8S_NODE_NAME}

    receivers:
      # Catch-all for pods that don't push OTLP natively. Discovers via
      # k8s_observer instead of a static list; a pod opts out with
      # labels[telemetry.miloapis.com/otlp-native-logs].
      receiver_creator/pods:
        watch_observers: [k8s_observer]
        receivers:
          filelog:
            rule: 'type == "pod.container" && pod.namespace != "o11y-system" && ("telemetry.miloapis.com/otlp-native-logs" in pod.labels ? pod.labels["telemetry.miloapis.com/otlp-native-logs"] : "") != "true"'
            config:
              include: ["/var/log/pods/`pod.namespace`_`pod.name`_`pod.uid`/`container_name`/*.log"]
              start_at: end
              include_file_path: true
              include_file_name: false
              operators:
                - id: container-parser
                  type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      # See README.md for the resource attribute contract. Associates by
      # k8s.pod.uid rather than connection, since filelog's container
      # operator already gives us that from the log file path.
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name
            - k8s.deployment.name
          labels:
            - tag_name: k8s.namespace.project_name
              key: resourcemanager.miloapis.com/project-name
              from: namespace
            - tag_name: k8s.namespace.upstream_cluster_name
              key: meta.datumapis.com/upstream-cluster-name
              from: namespace
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid

      resource:
        attributes:
          - key: k8s.cluster.name
            value: $${CLUSTER_NAME}
            action: upsert
          - key: service.namespace
            from_attribute: k8s.namespace.name
            action: insert
          - key: service.name
            from_attribute: k8s.container.name
            action: insert

      transform/milo_project_id:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - >-
                set(resource.attributes["milo.project.id"], resource.attributes["k8s.namespace.project_name"])
                where resource.attributes["k8s.namespace.project_name"] != nil and
                resource.attributes["k8s.namespace.project_name"] != ""
              - >-
                set(resource.attributes["milo.project.id"], resource.attributes["k8s.namespace.upstream_cluster_name"])
                where resource.attributes["milo.project.id"] == nil and
                IsMatch(resource.attributes["k8s.namespace.upstream_cluster_name"], "^cluster-")
              - replace_pattern(resource.attributes["milo.project.id"], "^cluster-", "")
              - >-
                set(resource.attributes["milo.project.id"], "internal")
                where resource.attributes["milo.project.id"] == nil
              # PoP token is required: the hub grants this leaf's NKey only
              # o11y.logs.<cluster>.*, and denied publishes are dropped silently.
              - >-
                set(resource.attributes["telemetry.subject"],
                Concat(["o11y.logs.", resource.attributes["k8s.cluster.name"], ".", resource.attributes["milo.project.id"]], ""))

      batch:
        timeout: 10s
        send_batch_size: 512

      # Explodes the batch back down to one record per outgoing message
      # right before export -- batch above amortizes the enrichment steps'
      # per-call overhead across many records; this controls the final
      # message granularity onto NATS. Not redundant with batch: different
      # jobs, same pipeline.
      unbatch: {}

    exporters:
      nats:
        url: nats.o11y-system.svc.cluster.local:4222
        subject_from_attribute: telemetry.subject
        # mTLS to the edge NATS server (nats.conf tls{verify:true}).
        tls:
          ca_file: /etc/otel/nats-client/ca.crt
          cert_file: /etc/otel/nats-client/tls.crt
          key_file: /etc/otel/nats-client/tls.key
        logs:
          # Fallback only; must match the leaf's grant like the attribute does.
          subject: o11y.logs.${cluster}.internal
          encoding: otlp_proto

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      extensions: [k8s_observer]
      pipelines:
        logs:
          receivers: [receiver_creator/pods]
          processors: [memory_limiter, k8sattributes, resource, transform/milo_project_id, batch, unbatch]
          exporters: [nats, debug]
