name: Publish Artifacts

on:
  push:
  pull_request:
  release:
    types: ['published']

jobs:
  publish-operator-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: telemetry
      registry-organization: milo-os
      context: operator
      dockerfile-path: operator/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-clickhouse-migrate-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: telemetry-clickhouse-migrate
      registry-organization: milo-os
      context: clickhouse-migrate
      dockerfile-path: clickhouse-migrate/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-nkey-generator-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: telemetry-nkey-generator
      registry-organization: milo-os
      context: nkey-generator
      dockerfile-path: nkey-generator/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-otelcol-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: o11y/otelcol
      registry-organization: milo-os
      context: .
      dockerfile-path: otelcol/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundle:
    # Build the images before publishing the bundle so the manifests that
    # Flux picks up reference images that already exist.
    needs:
      - publish-operator-image
      - publish-clickhouse-migrate-image
      - publish-otelcol-image
      - publish-queryapi-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.20.0
    with:
      bundle-name: ghcr.io/milo-os/o11y/kustomize
      bundle-path: config
      images: |
        - { path: config/operator/manager, name: ghcr.io/milo-os/telemetry, tag: "${{ needs.publish-operator-image.outputs.tag }}" }
        - { path: config/clickhouse-migrations, name: ghcr.io/milo-os/telemetry-clickhouse-migrate, tag: "${{ needs.publish-clickhouse-migrate-image.outputs.tag }}" }
        - { path: config/collectors, name: ghcr.io/milo-os/o11y/otelcol, tag: "${{ needs.publish-otelcol-image.outputs.tag }}" }
        - { path: config/queryapi, name: ghcr.io/milo-os/o11y/queryapi, tag: "${{ needs.publish-queryapi-image.outputs.tag }}" }
    secrets: inherit

  publish-queryapi-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.20.0
    with:
      image-name: o11y/queryapi
      registry-organization: milo-os
      context: queryapi
      dockerfile-path: queryapi/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit
