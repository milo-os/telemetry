name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      run: |
        go install sigs.k8s.io/controller-runtime/tools/setup-envtest@32759fab31191897ae86091d8831b2d4b890aedd
        KUBEBUILDER_ASSETS="$("$(go env GOPATH)/bin/setup-envtest" use 1.36 -p path)"
        export KUBEBUILDER_ASSETS
        for m in config clickhouse-migrate nkey-generator receiver/natsreceiver exporter/natsexporter processor/unbatchprocessor queryapi cli operator; do
          echo "::group::$m"
          (cd "$m" && go build ./... && go test $(go list ./... | grep -v /e2e) -timeout 10m)
          echo "::endgroup::"
        done
