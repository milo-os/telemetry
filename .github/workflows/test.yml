name: Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  test:
    name: Test (${{ matrix.module }}${{ matrix.suite && format(' {0}', matrix.suite) || '' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - module: config
            test-cmd: go test ./...
          - module: operator
            test-cmd: task test
          - module: clickhouse-migrate
            test-cmd: go test ./...
          - module: receiver/natsreceiver
            test-cmd: go test ./...
          - module: exporter/natsexporter
            test-cmd: go test ./...
          - module: processor/unbatchprocessor
            test-cmd: go test ./...
          - module: queryapi
            test-cmd: task test
          - module: queryapi
            suite: integration-prometheus
            test-cmd: task test-integration-prometheus
          - module: cli
            test-cmd: go test -race ./...
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Running Tests
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          ${{ matrix.test-cmd }}
